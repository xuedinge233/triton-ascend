name: "Auto labeling"

on:
  issues:
    types: [opened, edited]
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  label:
    # Single job with conditional steps — a skipped step doesn't clutter the PR
    # checks list the way a skipped job does.
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Label issue
        if: github.event_name == 'issues'
        uses: jimschubert/labeler-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          config_path: .github/actions/issue-labeler.yml

      - name: Label PR
        if: github.event_name == 'pull_request_target'
        uses: actions/labeler@v5
        with:
          configuration-path: .github/actions/labeler.yml
          sync-labels: true
