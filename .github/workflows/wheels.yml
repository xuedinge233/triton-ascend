name: Wheels

# ---------------------------------------------------------------------------
# External trigger interface (workflow_dispatch)
#
# External applications trigger a build through the GitHub REST API:
#
#   POST /repos/{owner}/{repo}/actions/workflows/wheels.yml/dispatches
#   Authorization: Bearer <token>
#   {"ref": "main",
#    "inputs": {"arch": "all", "python": "all", "branch": "all", "publish": true}}
#
# The token needs `actions:write` on this repo — BOT_TOKEN (already used by
# rebuild-tasks.yml to rerun runs through the API) has it. The endpoint
# answers 204 with no run id: locate the triggered run afterwards via
# `GET /repos/{owner}/{repo}/actions/runs?event=workflow_dispatch` (match on
# actor + created_at), or subscribe to the `workflow_run` webhook.
#
# Callers that cannot hold any actions:write token (GitHub secrets are
# write-only; BOT_TOKEN's value never leaves the secret store) use the
# ChatOps bridge instead: comment `/build-wheels ...` on any issue — see
# wheels-dispatch.yml.
#
# Inputs (empty/unset behaves exactly like push/schedule — full matrix):
#   arch     all | x86_64 | aarch64
#   python   all | comma-separated subset, e.g. "cp312" or "cp312,cp313"
#   branch   all | any ref/tag in matrix-prep's ALL_BRANCH, e.g. "main"
#   publish  true (default) | false — false builds and NPU-tests the wheels
#            but skips the OBS nightly upload
#
# Note: dispatches on the same ref share the concurrency group below
# (cancel-in-progress), so a second dispatch cancels the first.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Target architecture (all = x86_64 + aarch64)"
        type: choice
        options: [all, x86_64, aarch64]
        default: all
      python:
        description: "Python versions: all, or comma-separated (e.g. cp312,cp313)"
        type: string
        default: "all"
      branch:
        description: "Branch matrix entry to build (all = every enabled entry)"
        type: choice
        # Keep in sync with ALL_BRANCH in the matrix-prep job below.
        options: [all, main]
        # - main-dev
        # - release-3.2.2
        default: all
      publish:
        description: "Publish wheels to the OBS nightly repo after tests pass"
        type: boolean
        default: true
  push:
    branches: [release/**]
  pull_request:
    paths:
      - .github/workflows/wheels.yml
      - .github/workflows/build/wheels.Dockerfile
      - setup.py
      - pyproject.toml
      - version.txt
      - cmake/llvm-hash.txt
      - cmake/json-version.txt
  schedule:
    - cron: "0 8 * * *"

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:

  # Single source of truth for the build matrix. push/pull_request/schedule
  # events have no inputs and get the full matrix; workflow_dispatch callers
  # (UI or the dispatch API, see the header comment) can narrow each axis.
  # Build-Wheels and Publish-Wheels both consume these outputs, so the two
  # matrices can no longer drift apart.
  matrix-prep:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      config: ${{ steps.matrix.outputs.config }}
      python: ${{ steps.matrix.outputs.python }}
      branch: ${{ steps.matrix.outputs.branch }}
    steps:
      - name: Filter matrix by dispatch inputs
        id: matrix
        env:
          ARCH_IN: ${{ inputs.arch }}
          PYTHON_IN: ${{ inputs.python }}
          BRANCH_IN: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          ALL_CONFIG='[
            {"runs_on": "linux-amd64-cpu-4", "arch": "x86_64"},
            {"runs_on": "linux-aarch64-cpu-4", "arch": "aarch64"}
          ]'
          ALL_PYTHON='["cp310", "cp311", "cp312", "cp313"]'
          # npuir: OFF uses the prebuilt payload from npuir-build.yml, which
          # tracks the AscendNPU-IR stable branch and is branch-independent (all
          # matrix branches share the same payload); ON (only as the fallback
          # when no artifact is available) builds the payload in-image via
          # build_npuir.py, also from stable. When enabling another entry here,
          # also add it to the workflow_dispatch `branch` input options above.
          ALL_BRANCH='[
            {"ref": "main", "tag": "main", "local": "dev", "npuir": "OFF"}
          ]'
          # {"ref": "main-dev", "tag": "main-dev", "local": "dev", "npuir": "OFF"}
          # {"ref": "release/3.2.2", "tag": "release-3.2.2", "local": "release", "npuir": "OFF"}

          CONFIG=$(jq -c . <<<"$ALL_CONFIG")
          PYTHON=$(jq -c . <<<"$ALL_PYTHON")
          BRANCH=$(jq -c . <<<"$ALL_BRANCH")

          # Empty input = non-dispatch event; keep the full axis.
          if [ -n "$ARCH_IN" ] && [ "$ARCH_IN" != "all" ]; then
            CONFIG=$(jq -c --arg a "$ARCH_IN" 'map(select(.arch == $a))' <<<"$CONFIG")
          fi
          if [ -n "$BRANCH_IN" ] && [ "$BRANCH_IN" != "all" ]; then
            BRANCH=$(jq -c --arg b "$BRANCH_IN" 'map(select(.ref == $b or .tag == $b))' <<<"$BRANCH")
          fi
          if [ -n "$PYTHON_IN" ] && [ "$PYTHON_IN" != "all" ]; then
            PYTHON=$(jq -c -n --argjson all "$PYTHON" --arg in "$PYTHON_IN" '
              ($in | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))) as $want
              | ($want - $all) as $bad
              | if ($bad | length) > 0
                then error("unknown python version(s): \($bad | join(", ")); valid: \($all | join(", "))")
                else [$all[] | select(. as $p | $want | index($p))]
                end')
          fi

          if [ "$CONFIG" = "[]" ] || [ "$PYTHON" = "[]" ] || [ "$BRANCH" = "[]" ]; then
            echo "::error::dispatch inputs produced an empty matrix (arch='${ARCH_IN}' python='${PYTHON_IN}' branch='${BRANCH_IN}')"
            exit 1
          fi
          echo "config=${CONFIG} python=${PYTHON} branch=${BRANCH}"
          {
            echo "config=${CONFIG}"
            echo "python=${PYTHON}"
            echo "branch=${BRANCH}"
          } >> "$GITHUB_OUTPUT"

  Build-Wheels:
    name: Build wheels for ${{ matrix.config.arch }}-${{ matrix.python }}-${{ matrix.branch.tag }}
    needs: matrix-prep
    runs-on: ${{ matrix.config.runs_on }}
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.0-a3-ubuntu22.04-py3.12
    timeout-minutes: 360

    strategy:
      fail-fast: false
      # Limit parallelism: wheel builds compile hundreds of C++ files on
      # memory-constrained workers; too many at once causes OOM kills and
      # buildkitd/SWR auth timeouts.
      max-parallel: 6
      matrix:
        config: ${{ fromJSON(needs.matrix-prep.outputs.config) }}
        python: ${{ fromJSON(needs.matrix-prep.outputs.python) }}
        branch: ${{ fromJSON(needs.matrix-prep.outputs.branch) }}

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Check for new commits
        if: github.event_name == 'push'
        id: new-commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_SHA=$(gh api \
            "/repos/${{ github.repository }}/actions/workflows/wheels.yml/runs?branch=${{ github.ref_name }}&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')
          if [ "$LAST_SHA" = "${{ github.sha }}" ]; then
            echo "Current commit already has a successful wheel build. Skipping."
            echo "has_new_commits=false" >> $GITHUB_OUTPUT
          else
            echo "New commits detected. Proceeding with wheel build."
            echo "has_new_commits=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # PR: checkout the PR head, not the matrix.branch ref (main).
          # push/workflow_dispatch/schedule: use the matrix branch ref.
          ref: ${{ github.event_name != 'pull_request' && matrix.branch.ref || '' }}

      - name: Compute build variables
        id: vars
        shell: bash
        run: |
          NUM_PROCS=$(( $(nproc) / 6 ))
          if [ "$NUM_PROCS" -lt 1 ]; then NUM_PROCS=1; fi
          # Hard-cap at 8 to avoid OOM on memory-constrained buildkitd workers.
          if [ "$NUM_PROCS" -gt 8 ]; then NUM_PROCS=8; fi
          echo "max_jobs=${NUM_PROCS}" >> $GITHUB_OUTPUT
          BUILD_DATE=$(date -u +%Y%m%d)
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

      - name: Build wheels
        if: github.event_name != 'push' || steps.new-commits.outputs.has_new_commits != 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/workflows/build/wheels.Dockerfile
          build-args: |
            MANYLINUX_IMAGE=swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/pypa/manylinux_2_28_${{ matrix.config.arch }}:latest
            PYTHON_VERSION=${{ matrix.python }}
            MAX_JOBS=${{ steps.vars.outputs.max_jobs }}
            TRITON_WHEEL_VERSION_SUFFIX=+${{ matrix.branch.local }}
            BUILD_DATE=${{ steps.vars.outputs.build_date }}
          outputs: type=local,dest=./wheelhouse

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push' || steps.new-commits.outputs.has_new_commits != 'false'
        with:
          name: cibw-wheels-manylinux_2_28_${{ matrix.config.arch }}-${{ matrix.python }}-${{ matrix.branch.tag }}-wheels-upload
          path: ./wheelhouse/*.whl
          # Wheels are already zip-compressed; skip the re-compress pass.
          compression-level: 0

  # Installs the built wheels on real NPU pods and runs a representative
  # subset of the Ascend unit tests (vector add / softmax / matmul / layer
  # norm / attention / grouped gemm / argmax / cumsum / add / dot). This
  # exercises the wheel's bundled BishengIR compiler end to end: nothing on
  # PATH provides bisheng binaries, so the backend must use the wheel copy.
  # The job reports status only; Build-Wheels uploads to OBS independently.
  Test-Wheels:
    name: Test wheels on NPU (${{ matrix.config.chip_type }})
    needs: Build-Wheels
    runs-on: ${{ matrix.config.runs_on }}
    container:
      # Same image as integration-tests-ascend.yml (proven to pull on these
      # pods): region cn-southwest-2, tag = cann_version-chip_type-os-pyX.
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/triton:${{ matrix.config.cann_version }}-${{ matrix.config.chip_type }}-${{ matrix.config.os }}-py${{ matrix.config.python_version }}-latest
    timeout-minutes: 120
    env:
      PYTHON: python3
      PIP_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      PIP_TRUSTED_HOST: "cache-service.nginx-pypi-cache.svc.cluster.local"
      PIP_EXTRA_INDEX_URL: "https://repo.huaweicloud.com/ascend/repos/pypi"
    strategy:
      fail-fast: false
      matrix:
        config:
          # a3 pods carry py3.10/3.11 images -> cp311 wheel; a5 (950) -> cp312.
          - {runs_on: ['linux-aarch64-a3-800i-4', 'cn12-001'], chip_type: 'a3', arch: 'aarch64', cann_version: '8.5.0', os: 'ubuntu22.04', python_version: '3.11', python: 'cp311'}
          - {runs_on: ['linux-amd64-a5-2'], chip_type: '950', arch: 'x86_64', cann_version: '9.1.0', os: 'ubuntu22.04', python_version: '3.12', python: 'cp312'}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name != 'pull_request' && 'main' || '' }}
          submodules: "true"

      - name: Add git safe directory
        run: git config --global --add safe.directory "*"

      - name: Download built wheel
        id: download
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: cibw-wheels-manylinux_2_34_${{ matrix.config.arch }}-${{ matrix.config.python }}-main-wheels-upload
          path: wheelhouse

      - name: Test wheel on NPU
        shell: bash
        run: |
          set -eu
          WHL=$(ls wheelhouse/*.whl 2>/dev/null | head -1 || true)
          if [ -z "${WHL}" ]; then
            echo "No wheel artifact (commit already published or build skipped); skipping tests"
            exit 0
          fi
          echo "Testing ${WHL}"
          source /usr/local/Ascend/cann/set_env.sh || true
          # Install the wheel itself; do NOT put any external bisheng
          # install on PATH, so the backend must use the bundled copy.
          python3 -m pip install --force-reinstall --no-deps "${WHL}"
          npu-smi info || true
          # Verify the wheel actually carries the bundled BishengIR payload
          # (backend/utils.py prefers this dir; without it the backend falls
          # back to the system bishengir whose MLIR version mismatches).
          python3 - <<'PYEOF'
          import os
          import triton

          backend_dir = os.path.join(os.path.dirname(triton.__file__), "backends", "ascend", "bishengir")
          print("bundled bishengir dir:", backend_dir)
          print("exists:", os.path.isdir(backend_dir))
          if os.path.isdir(backend_dir):
              print("contents:", sorted(os.listdir(backend_dir)))
              bin_dir = os.path.join(backend_dir, "bin")
              print("bin:", sorted(os.listdir(bin_dir)) if os.path.isdir(bin_dir) else "<no bin/>")
          PYEOF
          python3 -m pip install pytest pytest-xdist 2>/dev/null || true
          python3 -m pytest -s -v -n 4 --dist=loadfile \
            third_party/ascend/unittest/pytest_ut/test_01_vector_add.py \
            third_party/ascend/unittest/pytest_ut/test_02_fused_softmax.py \
            third_party/ascend/unittest/pytest_ut/test_03_matrix_multiplication.py \
            third_party/ascend/unittest/pytest_ut/test_05_layer_norm.py \
            third_party/ascend/unittest/pytest_ut/test_06_fused_attention.py \
            third_party/ascend/unittest/pytest_ut/test_08_grouped_gemm.py \
            third_party/ascend/unittest/pytest_ut/test_argmax.py \
            third_party/ascend/unittest/pytest_ut/test_cumsum.py \
            third_party/ascend/unittest/pytest_ut/test_add.py \
            third_party/ascend/unittest/pytest_ut/test_dot.py

  # Publishes the wheels to the OBS nightly pypi repo, gated on the NPU
  # tests: if Test-Wheels fails, this job never starts, so a broken wheel
  # is never published. The matrix comes from matrix-prep and therefore
  # mirrors Build-Wheels exactly. workflow_dispatch callers can opt out via
  # the `publish` input: format() renders the boolean as 'true'/'false' and
  # the empty inputs context on push/schedule as '', so scheduled and
  # release builds keep publishing.
  Publish-Wheels:
    name: Publish wheels (${{ matrix.config.arch }}-${{ matrix.python }}-${{ matrix.branch.tag }})
    needs: [matrix-prep, Build-Wheels, Test-Wheels]
    if: github.event_name != 'pull_request' && format('{0}', inputs.publish) != 'false'
    runs-on: ${{ matrix.config.runs_on }}
    container:
      image: swr.cn-north-12.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.0-a3-ubuntu22.04-py3.12
      env:
        PYTHON: ${{matrix.python}}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.matrix-prep.outputs.config) }}
        python: ${{ fromJSON(needs.matrix-prep.outputs.python) }}
        branch: ${{ fromJSON(needs.matrix-prep.outputs.branch) }}
    steps:
      - name: Download built wheel
        id: download
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: cibw-wheels-manylinux_2_34_${{ matrix.config.arch }}-${{ matrix.python }}-${{ matrix.branch.tag }}-wheels-upload
          path: wheelhouse

      - name: Setup obsutil and upload to OBS
        if: github.event_name != 'pull_request' && (github.event_name != 'push' || steps.new-commits.outputs.has_new_commits != 'false')
        shell: bash
        env:
          AK: ${{ secrets.NIGHTLY_OBS_AK }}
          SK: ${{ secrets.NIGHTLY_OBS_SK }}
          ARCH: ${{ matrix.config.arch == 'x86_64' && 'amd64' || 'arm64' }}
        run: |
          set -eu
          if [ -z "${AK}" ] || [ -z "${SK}" ]; then
            echo "OBS credentials are empty."
            exit 1
          fi
          curl -fL "https://obs-community.obs.cn-north-1.myhuaweicloud.com/obsutil/current/obsutil_linux_${ARCH}.tar.gz" -o obsutil.tar.gz
          gzip -t obsutil.tar.gz || { echo "obsutil.tar.gz is not a valid gzip"; exit 1; }
          tar xzf obsutil.tar.gz
          rm -f obsutil.tar.gz
          mv obsutil_linux_* obsutil

          obsutil/obsutil config -i="${AK}" -k="${SK}" -e=https://obs.cn-north-4.myhuaweicloud.com
          OBS_DIR="obs://ascend-artifcat-packages/pypi/packages/ascend/repos/pypi/nightly/triton-ascend/"
          obsutil/obsutil cp -u wheelhouse/*.whl "${OBS_DIR}"

          # Regenerate index.html from every .whl currently in the directory
          # (non-recursive, short format), keeping only the basenames.
          obsutil/obsutil ls "${OBS_DIR}" -d -s -limit=0 \
            | grep -oE '[^/]+\.whl$' \
            | sort -u > files.txt
          while IFS= read -r f; do
            printf "<a href='%s'>%s</a><br />\n" "$f" "$f"
          done < files.txt > index.html
          obsutil/obsutil cp index.html "${OBS_DIR}"
