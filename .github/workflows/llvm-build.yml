name: Publish upstream Ubuntu LLVM for PR 3394

on:
  push:
    branches: [ci/publish-pr3394-upstream-ubuntu]
    paths: [.github/workflows/llvm-build.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-pr3394-upstream-ubuntu
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'xuedinge233/triton-ascend' && github.ref == 'refs/heads/ci/publish-pr3394-upstream-ubuntu'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-22.04-arm
            artifact: '14989503421'
            digest: 61d657ecd3b4ad7dfa50bf8223024cc96352a5c3c9458a4d79b44252684fc536
          - arch: x64
            runner: ubuntu-22.04
            artifact: '14989136537'
            digest: 8f20e66483f0705627ca687a7f4823b3ff2b77421ab57de28b7d48c4e9ef110f
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      NAME: llvm-f6ded0be-0886b17f-ubuntu-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cd8c39a7181e6e8a10ebd3926a5d0d3cfe717e9b
          persist-credentials: false
      - name: Download the pinned upstream artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ matrix.artifact }}
          DIGEST: ${{ matrix.digest }}
        run: |
          set -eu
          api=https://api.github.com/repos/triton-lang/triton-ascend/actions
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            "$api/artifacts/$ARTIFACT/zip" -o "$RUNNER_TEMP/upstream.zip"
          echo "$DIGEST  $RUNNER_TEMP/upstream.zip" | sha256sum -c -
          test "$(unzip -Z1 "$RUNNER_TEMP/upstream.zip")" = "$NAME.tar.gz"
          unzip -q "$RUNNER_TEMP/upstream.zip" -d "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          sha256sum "$NAME.tar.gz" | tee "$NAME.sha256"
      - name: Test the SDK against both BlockBatching UBSan cases
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          tar -xzf "$NAME.tar.gz" "$NAME/bin/llvm-config" "$NAME/include" \
            "$NAME/lib/libLLVMSupport.a" "$NAME/lib/libLLVMDemangle.a"
          export LLVM_SYSPATH="$RUNNER_TEMP/$NAME"
          libs="$("$LLVM_SYSPATH/bin/llvm-config" --libs support --system-libs)"
          echo "$libs"
          case " $libs " in *" -lxml2 "*) exit 1;; esac
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import ast
          from pathlib import Path
          import tempfile

          source = Path("third_party/ascend/unittest/pytest_ut/test_block_batching_compiler.py").resolve()
          tree = ast.parse(source.read_text())
          test, = [node for node in tree.body if getattr(node, "name", "") == "test_checked_batching_values_under_ubsan"]
          cases = ast.literal_eval(test.decorator_list[0].args[1])
          assert len(cases) == 2
          test.decorator_list = []
          tree.body = [test]
          namespace = {"__file__": str(source)}
          exec(compile(tree, str(source), "exec"), namespace)
          for name, implementations in cases:
              with tempfile.TemporaryDirectory() as tmp:
                  namespace[test.name](Path(tmp), name, implementations)
              print(f"{name} passed", flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-ubuntu-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/llvm-f6ded0be-0886b17f-ubuntu-${{ matrix.arch }}.tar.gz
            ${{ runner.temp }}/llvm-f6ded0be-0886b17f-ubuntu-${{ matrix.arch }}.sha256
          compression-level: 0
          retention-days: 2

  publish:
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: verified-ubuntu-*
          merge-multiple: true
      - name: Verify both inputs and prepare obsutil
        run: |
          set -eu
          sha256sum -c llvm-*.sha256
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 https://obs-community.obs.cn-north-1.myhuaweicloud.com/obsutil/current/obsutil_linux_amd64.tar.gz -o obsutil.tar.gz
          tar -xzf obsutil.tar.gz
          install -m 0700 obsutil_linux_amd64*/obsutil "$RUNNER_TEMP/obsutil"
      - name: Back up both previous versions and publish the verified tarballs
        env:
          AK: ${{ secrets.OBS_AK }}
          SK: ${{ secrets.OBS_SK }}
        run: |
          set -euo pipefail
          obs="$RUNNER_TEMP/obsutil"
          cfg="$RUNNER_TEMP/obsutil.conf"
          chmod 700 "$RUNNER_TEMP"
          trap 'rm -f "$cfg"' EXIT
          "$obs" config -config="$cfg" -i="$AK" -k="$SK" -e=https://obs.cn-southwest-2.myhuaweicloud.com
          unset AK SK
          bucket=obs://triton-ascend-artifacts/llvm-builds
          public=https://triton-ascend-artifacts.obs.cn-southwest-2.myhuaweicloud.com/llvm-builds
          backup=backups/pr-3394-before-45531025590
          declare -A old=( [arm64]=d52cc54267015b73e4759f2ecfabe1a5-29 [x64]=26c1996492395e3e2df997082ec2f0a2-30 )
          declare -A size=( [arm64]=1196819035 [x64]=1235030544 )
          etag() { curl -fsSI --retry 3 "$1" | awk 'tolower($1)=="etag:" {gsub(/["\r]/,"",$2); print $2}'; }
          public_sha() { curl -fsSL --retry 3 "$1" -o "$RUNNER_TEMP/readback" && sha256sum "$RUNNER_TEMP/readback" | cut -d' ' -f1; }
          declare -A todo
          for arch in arm64 x64; do
            file=llvm-f6ded0be-0886b17f-ubuntu-$arch.tar.gz
            current=$(etag "$public/$file")
            expected=$(cut -d' ' -f1 "${file%.tar.gz}.sha256")
            if [[ "$current" != "${old[$arch]}" ]]; then
              test "$(public_sha "$public/$file")" = "$expected"
              echo "$arch already published and verified"
              continue
            fi
            if ! "$obs" stat "$bucket/$backup/$file" -config="$cfg" >/dev/null; then
              "$obs" cp "$bucket/$file" "$bucket/$backup/$file" -f -config="$cfg"
            fi
            # A multipart copy can change the ETag. Compare the actual bytes.
            curl -fsSL --retry 3 -H "If-Match: \"${old[$arch]}\"" "$public/$file" -o "$RUNNER_TEMP/previous"
            test "$(stat -c %s "$RUNNER_TEMP/previous")" = "${size[$arch]}"
            previous=$(sha256sum "$RUNNER_TEMP/previous" | cut -d' ' -f1)
            "$obs" cp "$bucket/$backup/$file" "$RUNNER_TEMP/backup-$arch" -f -config="$cfg"
            echo "$previous  $RUNNER_TEMP/backup-$arch" | sha256sum -c -
            rm "$RUNNER_TEMP/backup-$arch" "$RUNNER_TEMP/previous"
            echo "Backup verified: $backup/$file SHA256 $previous"
            todo[$arch]=yes
          done
          for arch in arm64 x64; do
            [[ -n "${todo[$arch]:-}" ]] || continue
            file=llvm-f6ded0be-0886b17f-ubuntu-$arch.tar.gz
            test "$(etag "$public/$file")" = "${old[$arch]}"
            "$obs" cp "$file" "$bucket/$file" -f -config="$cfg"
            expected=$(cut -d' ' -f1 "${file%.tar.gz}.sha256")
            test "$(public_sha "$public/$file")" = "$expected"
            echo "$file public SHA256 $expected"
          done
