# OBS Cache — drop-in replacement for actions/cache@v4.
#
# Usage example (kept in comments because `${{ }}` is NOT allowed inside
# the `description` field — the manifest template engine parses it):
#
# Composite actions have no post-step, so split restore and save into two
# invocations around the build:
#
#   # Restore before the build (PR-safe — no credentials needed):
#   - uses: ./.github/actions/obs-cache
#     with:
#       mode: restore-only
#       key:   ${{ runner.os }}-${{ runner.arch }}-mycache-${{ hashFiles('...') }}
#       restore-keys: ${{ runner.os }}-${{ runner.arch }}-mycache-
#       path: |
#         ~/.mycache
#         ${{ github.workspace }}/.buildcache
#
#   # Save after the build (push only — credentials are required):
#   - if: github.event_name == 'push'
#     uses: ./.github/actions/obs-cache
#     with:
#       mode: save-only
#       key:   ${{ runner.os }}-${{ runner.arch }}-mycache-${{ hashFiles('...') }}
#       path: |
#         ~/.mycache
#         ${{ github.workspace }}/.buildcache
#       obs-ak: ${{ secrets.OBS_AK }}
#       obs-sk: ${{ secrets.OBS_SK }}
#
# Cache object layout in OBS:
#   s3://<bucket>/<cache-prefix>/<sha256(key)>.tar.gz

name: OBS Cache
description: >
  Drop-in replacement for actions/cache@v4 that stores caches in OBS
  (Huawei Cloud Object Storage) instead of GitHub's cache backend.
  See the usage example in the comments at the top of this file.

  Prerequisites: the cache prefix (s3://<bucket>/<cache-prefix>/) must have
  public-read access so that PR workflows can download without credentials.

  Security model:
  - Restore (read): public OBS URLs — works on PR and push, no secrets needed.
  - Save (write): obsutil with AK/SK — only runs when credentials are provided.
    Callers SHOULD only pass secrets on push events so that PR workflows can
    never write to the cache bucket.

inputs:
  mode:
    required: false
    default: both
    description: >
      both (default): restore then save in one invocation — only suitable
      when the cache data is already populated.  restore-only: use before
      the build (PR-safe, no credentials needed).  save-only: use after the
      build on push events with credentials.
  key:
    required: true
    description: 'Primary cache key (exact match).'
  restore-keys:
    required: false
    description: >
      Fallback keys, one per line.  Each is tried as an exact match.
      (Prefix-based restore-keys from actions/cache@v4 are NOT supported
      in this version — pass concrete fallback keys instead.)
  path:
    required: true
    description: 'File paths to cache, one per line.  Tilde (~) and $GITHUB_WORKSPACE are expanded.'
  bucket:
    required: false
    default: triton-ascend-cache
    description: 'OBS bucket name.'
  endpoint:
    required: false
    default: obs.cn-north-12.myhuaweicloud.com
    description: 'OBS endpoint (region-specific).'
  cache-prefix:
    required: false
    default: triton-ascend-cache
    description: 'Object key prefix inside the bucket.'
  obs-ak:
    required: false
    default: ''
    description: 'OBS Access Key — pass secrets.OBS_AK on push; leave empty on PR.'
  obs-sk:
    required: false
    default: ''
    description: 'OBS Secret Key — pass secrets.OBS_SK on push; leave empty on PR.'

outputs:
  cache-hit:
    description: '"true" when an exact key match was found and restored.'
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # ── Restore ────────────────────────────────────────────────────────────
    - name: Restore cache from OBS
      id: restore
      if: inputs.mode == 'both' || inputs.mode == 'restore-only'
      shell: bash
      env:
        KEY: ${{ inputs.key }}
        RESTORE_KEYS: ${{ inputs.restore-keys }}
        PATHS: ${{ inputs.path }}
        BUCKET: ${{ inputs.bucket }}
        ENDPOINT: ${{ inputs.endpoint }}
        PREFIX: ${{ inputs.cache-prefix }}
      run: |
        set -euo pipefail

        # ---- helpers -------------------------------------------------------
        safe_key() {
          # Produce a URL- and OBS-safe filename from an arbitrary cache key.
          echo -n "$1" | sha256sum | cut -d' ' -f1
        }

        expand_paths() {
          # Expand bash-style ${GITHUB_WORKSPACE} and ~ in path lines.
          # Note: callers receive the github.workspace expression already
          # expanded by the workflow engine, so only bash vars need handling.
          local raw="$1"
          local out=""
          while IFS= read -r p; do
            [ -z "${p:-}" ] && continue
            p="${p//\$\{GITHUB_WORKSPACE\}/${GITHUB_WORKSPACE}}"
            # Expand ~ to $HOME (without adding quotes).
            p="${p//\~/${HOME}}"
            # strip trailing slash so tar behaves predictably
            p="${p%/}"
            out="${out}${out:+ }${p}"
          done <<< "${raw}"
          echo "$out"
        }

        # ---- resolve URL ---------------------------------------------------
        BASE_URL="https://${BUCKET}.${ENDPOINT}/${PREFIX}"

        CACHE_HIT="false"
        FOUND_KEY=""

        download_and_check() {
          local label="$1"   # human-readable label for logging
          local ck="$2"      # raw cache key
          local file
          file="$(safe_key "${ck}").tar.gz"
          local url="${BASE_URL}/${file}"

          echo "  [${label}] ${ck}"
          echo "    URL: ${url}"

          local http_code
          http_code=$(curl -sS -w '%{http_code}' -o /tmp/obs-cache.tar.gz "${url}" || echo "000")

          if [ "${http_code}" = "200" ]; then
            echo "    ✓ HTTP 200 — $(du -h /tmp/obs-cache.tar.gz | cut -f1)"
            return 0
          fi

          case "${http_code}" in
            403) echo "    ✗ HTTP 403 — access denied; is the public-read policy configured for ${PREFIX}/* ?" ;;
            404) echo "    ✗ HTTP 404 — object not found in OBS" ;;
            *)   echo "    ✗ HTTP ${http_code} — download failed" ;;
          esac
          rm -f /tmp/obs-cache.tar.gz
          return 1
        }

        echo "::group::OBS cache restore"
        echo "  Bucket: ${BUCKET}.${ENDPOINT}/${PREFIX}"

        # 1) Try primary key
        if download_and_check "primary key" "${KEY}"; then
          CACHE_HIT="true"
          FOUND_KEY="${KEY}"
        fi

        # 2) Try each restore key (exact match, not prefix)
        if [ "${CACHE_HIT}" = "false" ] && [ -n "${RESTORE_KEYS:-}" ]; then
          while IFS= read -r rk; do
            [ -z "${rk:-}" ] && continue
            if download_and_check "restore key" "${rk}"; then
              FOUND_KEY="${rk}"
              break
            fi
          done <<< "${RESTORE_KEYS}"
        fi

        # 3) Extract if we got a tarball
        if [ -n "${FOUND_KEY:-}" ]; then
          EXPANDED_PATHS=$(expand_paths "${PATHS}")

          # Create parent directories so tar doesn't fail on missing roots.
          for p in ${EXPANDED_PATHS}; do
            mkdir -p "$(dirname "${p}")" 2>/dev/null || true
          done

          # Extract from / so absolute paths line up.
          cd /
          tar xzf /tmp/obs-cache.tar.gz 2>/dev/null || true
          rm -f /tmp/obs-cache.tar.gz

          echo "OBS cache hit: ${FOUND_KEY}"
        else
          echo "OBS cache miss — no matching key found"
        fi

        echo "cache-hit=${CACHE_HIT}" >> "${GITHUB_OUTPUT}"
        echo "::endgroup::"

    # ── Save ───────────────────────────────────────────────────────────────
    # Only executes when OBS credentials are present (i.e. on push events).
    - name: Save cache to OBS
      if: (inputs.mode == 'both' || inputs.mode == 'save-only') && inputs.obs-ak != '' && inputs.obs-sk != ''
      shell: bash
      env:
        KEY: ${{ inputs.key }}
        PATHS: ${{ inputs.path }}
        BUCKET: ${{ inputs.bucket }}
        ENDPOINT: ${{ inputs.endpoint }}
        PREFIX: ${{ inputs.cache-prefix }}
        AK: ${{ inputs.obs-ak }}
        SK: ${{ inputs.obs-sk }}
      run: |
        set -euo pipefail

        echo "::group::OBS cache save"

        # ---- helpers -------------------------------------------------------
        safe_key() { echo -n "$1" | sha256sum | cut -d' ' -f1; }

        expand_paths() {
          local raw="$1"
          local out=""
          while IFS= read -r p; do
            [ -z "${p:-}" ] && continue
            p="${p//\$\{GITHUB_WORKSPACE\}/${GITHUB_WORKSPACE}}"
            p="${p//\~/${HOME}}"
            p="${p%/}"
            out="${out}${out:+ }${p}"
          done <<< "${raw}"
          echo "$out"
        }

        # ---- download obsutil ----------------------------------------------
        ARCH="$(uname -m)"
        case "${ARCH}" in
          x86_64)  OBS_ARCH=amd64 ;;
          aarch64) OBS_ARCH=arm64 ;;
          *)       echo "ERROR: unsupported arch ${ARCH}" >&2; exit 1 ;;
        esac

        OBSUTIL_URL="https://obs-community.obs.cn-north-1.myhuaweicloud.com/obsutil/current/obsutil_linux_${OBS_ARCH}.tar.gz"
        curl -fL "${OBSUTIL_URL}" -o /tmp/obsutil.tar.gz
        gzip -t /tmp/obsutil.tar.gz || { echo "obsutil.tar.gz is not a valid gzip" >&2; exit 1; }
        tar xzf /tmp/obsutil.tar.gz -C /tmp
        rm -f /tmp/obsutil.tar.gz
        OBSUTIL=$(echo /tmp/obsutil_linux_*/obsutil)
        chmod +x "${OBSUTIL}"

        "${OBSUTIL}" config -i="${AK}" -k="${SK}" -e="https://${ENDPOINT}"

        # ---- create tarball -------------------------------------------------
        EXPANDED_PATHS=$(expand_paths "${PATHS}")

        # Collect only paths that actually exist (some may be created during
        # the build and never populated; skip them to avoid tar warnings).
        EXISTING=""
        for p in ${EXPANDED_PATHS}; do
          if [ -e "${p}" ]; then
            EXISTING="${EXISTING}${EXISTING:+ }${p}"
          else
            echo "  [skip] ${p} (does not exist)"
          fi
        done

        if [ -z "${EXISTING}" ]; then
          echo "No cache paths exist — nothing to upload"
          echo "::endgroup::"
          exit 0
        fi

        SAFE_FILE="$(safe_key "${KEY}").tar.gz"
        cd /
        tar czf "/tmp/${SAFE_FILE}" ${EXISTING}
        echo "Created /tmp/${SAFE_FILE} ($(du -h "/tmp/${SAFE_FILE}" | cut -f1))"

        # Guard against uploading an empty cache: a tarball holding nothing
        # but directory entries is a few hundred bytes, and uploading it would
        # overwrite a real cache under the same key. 10KB is the floor — a
        # real cache (ccache, downloaded LLVM trees, ...) is always larger.
        TARBALL_SIZE=$(stat -c%s "/tmp/${SAFE_FILE}" 2>/dev/null || stat -f%z "/tmp/${SAFE_FILE}")
        if [ "${TARBALL_SIZE}" -lt 10240 ]; then
          echo "Cache tarball is only ${TARBALL_SIZE} bytes (empty dirs only) — skipping upload"
          echo "  so an existing cache under this key is not overwritten."
          rm -f "/tmp/${SAFE_FILE}"
          echo "::endgroup::"
          exit 0
        fi

        # ---- upload --------------------------------------------------------
        "${OBSUTIL}" cp -u "/tmp/${SAFE_FILE}" "obs://${BUCKET}/${PREFIX}/${SAFE_FILE}"
        echo "Uploaded to obs://${BUCKET}/${PREFIX}/${SAFE_FILE}"

        rm -f "/tmp/${SAFE_FILE}"
        echo "::endgroup::"
