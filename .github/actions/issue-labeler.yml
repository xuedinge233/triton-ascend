# Issue auto-labeling rules (simple schema for jimschubert/labeler-action)
# Each label maps to a list of regex patterns matched case-insensitively
# against the issue title + body.

labels:
  # ── Component ──
  'ssbuffer':
    - 'ssbuffer|splitdataflow|allocmulticache|crossdeps|markop|planCube'

  'autotune':
    - 'autotune|auto_tuning|auto_tune'

  # ── Type ──
  'bug':
    - 'miscompiled|结果不准|结果不对|incorrect result|wrong result|精度错误|精度不对'
    - 'compilation error|编译失败|coredump|NoTritonConfigsError'
    - 'install.*(?:错误|失败)|安装.*(?:失败|错误)|version.*不匹配'

  'performance':
    - '精度|precision'
    - '性能|开箱性能|慢|performance'

  'documentation':
    - '文档|doc |readme|quick.?start|文档出现错误'

  'community-task':
    - '社区任务|任务书|开源共建'
